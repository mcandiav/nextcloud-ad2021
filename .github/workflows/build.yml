name: Build nextcloud-ad2021

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nextcloud-ad2021:test

      - name: Validate SMB support
        run: |
          docker run --rm --entrypoint php nextcloud-ad2021:test -m | grep -Fx smbclient
          docker run --rm --entrypoint sh nextcloud-ad2021:test -c 'command -v smbclient && smbclient --version'

      - name: Build and publish versioned image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nextcloud-ad2021:32.0.2-ad2021.1
            ghcr.io/${{ github.repository_owner }}/nextcloud-ad2021:${{ github.sha }}
